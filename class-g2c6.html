<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>学迹｜高二6班学习记录</title>
<style>
:root{--bg:#f6f7f9;--surface:#fff;--text:#25272a;--muted:#70757d;--line:#e2e5e9;--blue:#2878d0;--blue-soft:#e8f2fd;--green:#2f8f62;--green-soft:#e8f4ed;--orange:#a85e20;--orange-soft:#fbefe4;--red:#c94f47;--red-soft:#fcecea;--shadow:0 1px 2px rgba(20,25,32,.04),0 8px 26px rgba(20,25,32,.05)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;-webkit-font-smoothing:antialiased}.topbar{height:64px;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.topbar-inner{max-width:1180px;height:100%;margin:auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:11px}.mark{width:36px;height:36px;border-radius:10px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800}.brand b{font-size:17px}.brand span,.updated{display:block;color:var(--muted);font-size:12px}.readonly{padding:6px 9px;border-radius:7px;background:var(--green-soft);color:#24764f;font-size:12px;font-weight:750}.wrap{max-width:1180px;margin:28px auto;padding:0 24px 48px}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:18px}.eyebrow{color:var(--blue);font-weight:750;font-size:13px}.hero h1{margin:3px 0 5px;font-size:28px;line-height:1.2}.hero p{margin:0;color:var(--muted)}.class-tabs{display:flex;gap:8px}.class-btn{min-height:42px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 13px;color:var(--muted);font-weight:700;cursor:pointer}.class-btn.active{background:var(--blue-soft);border-color:#cfe4f8;color:#155b9e}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.metric{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 16px}.metric span{display:block;color:var(--muted);font-size:12px;font-weight:650}.metric b{display:block;font-size:25px;line-height:1.2;margin-top:5px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}.panel-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:15px}.panel-title{font-size:17px;font-weight:760}.panel-sub{color:var(--muted);font-size:12px;margin-top:2px}.filters{padding:14px 20px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:160px minmax(220px,1fr) auto;gap:10px}.select,.input,.btn{height:42px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:0 12px;color:var(--text);font:inherit}.input{width:100%}.btn{cursor:pointer;font-weight:700}.list{padding:5px 20px 20px}.record{padding:16px 2px;border-bottom:1px solid var(--line)}.record:last-child{border-bottom:0}.record-top{display:grid;grid-template-columns:minmax(220px,1fr) auto;gap:16px;align-items:center}.title{font-weight:760;font-size:16px}.meta{display:flex;gap:9px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:5px}.tag{display:inline-flex;padding:2px 7px;border-radius:6px;background:var(--blue-soft);color:#155b9e;font-size:11px;font-weight:750}.numbers{display:flex;gap:14px;color:var(--muted);font-size:12px}.numbers b{color:var(--text);font-size:15px;margin-right:3px}.follow{margin-top:11px;padding:10px 12px;border-radius:9px;background:var(--orange-soft);color:#82501f;font-size:13px}.follow b{margin-right:8px;color:#6c3d13}.details{margin-top:10px}.details summary{cursor:pointer;color:#155b9e;font-size:13px;font-weight:700;min-height:36px;display:flex;align-items:center}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:9px}table{width:100%;border-collapse:collapse;min-width:700px}th,td{text-align:left;padding:10px 11px;border-bottom:1px solid #edf0f2}th{font-size:12px;color:var(--muted);background:#fafbfc}tr:last-child td{border-bottom:0}.status-good{color:var(--green);font-weight:750}.status-risk{color:var(--red);font-weight:750}.empty{text-align:center;padding:72px 20px;color:var(--muted)}.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:5px}.error{margin:0 0 14px;padding:11px 13px;border-radius:9px;background:var(--red-soft);color:#983b35;display:none}.foot{text-align:center;color:var(--muted);font-size:12px;padding:20px}.skeleton{animation:pulse 1.3s infinite alternate}@keyframes pulse{to{opacity:.45}}
@media(max-width:760px){.wrap{padding:0 14px 36px;margin-top:18px}.topbar-inner{padding:0 14px}.hero{align-items:flex-start;flex-direction:column}.metrics{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr}.record-top{grid-template-columns:1fr}.numbers{justify-content:flex-start}.hero h1{font-size:24px}.updated{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-inner"><div class="brand"><div class="mark">学</div><div><b>学迹</b><span id="brandSub">高二6班学习记录</span></div></div><div><span class="readonly">只读页面</span><span class="updated" id="updated">正在加载数据…</span></div></div></header>
<main class="wrap"><section class="hero"><div><div class="eyebrow" id="classEyebrow">高二6班</div><h1>学习记录</h1><p>页面仅供学生和家长查看，姓名已经脱敏。</p></div><div class="class-tabs" id="classTabs"></div></section><div class="error" id="errorBox"></div><section class="metrics" id="metrics"><div class="metric skeleton"><span>任务</span><b>—</b></div><div class="metric skeleton"><span>记录人次</span><b>—</b></div><div class="metric skeleton"><span>达标</span><b>—</b></div><div class="metric skeleton"><span>待跟进</span><b>—</b></div></section><section class="panel"><div class="panel-head"><div><div class="panel-title">历史记录</div><div class="panel-sub">可按任务类型或关键词筛选，展开查看学生明细。</div></div></div><div class="filters"><select class="select" id="typeFilter"><option value="all">全部类型</option><option value="dictation">听写</option><option value="recitation">背诵</option><option value="homework">作业</option></select><input class="input" id="searchInput" placeholder="搜索任务内容"><button class="btn" id="resetBtn">重置</button></div><div class="list" id="recordList"><div class="empty">正在载入…</div></div></section><div class="foot">数据由教师发布 · 本页面无法编辑</div></main>
<script>
const CLASS_INFO=[{id:'g1c8',name:'高一8班',count:55},{id:'g2c6',name:'高二6班',count:52}];
const TYPES={dictation:'听写',recitation:'背诵',homework:'作业'};
const STATUS={excellent:'优秀',pass:'及格',fail:'不及格',done:'完成',makeup:'待补',missing:'未完成',leave:'请假',absent:'缺席',unset:'未标记'};
const good=s=>['excellent','pass','done'].includes(s), risk=s=>['fail','makeup','missing'].includes(s);
let records=[],currentClass='g2c6';
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function dateCN(v){if(!v)return'';const [y,m,d]=v.split('-');return `${y}年${+m}月${+d}日`}
function renderTabs(){$('#classTabs').innerHTML='';$('#classTabs').style.display='none'}
function visibleRecords(){const type=$('#typeFilter').value,q=$('#searchInput').value.trim();return records.filter(r=>r.classId===currentClass&&(type==='all'||r.type===type)&&(!q||String(r.title||'').includes(q))).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')))}
function render(){renderTabs();const ci=CLASS_INFO.find(c=>c.id===currentClass);$('#classEyebrow').textContent=ci.name;$('#brandSub').textContent=`${ci.name}学习记录`;document.title=`学迹｜${ci.name}学习记录`;const classRecords=records.filter(r=>r.classId===currentClass),entries=classRecords.flatMap(r=>(r.entries||[]).filter(e=>e.status&&e.status!=='unset')),success=entries.filter(e=>good(e.status)).length,follow=entries.filter(e=>risk(e.status)).length;$('#metrics').innerHTML=`<div class="metric"><span>历史任务</span><b>${classRecords.length}</b></div><div class="metric"><span>记录人次</span><b>${entries.length}</b></div><div class="metric"><span>达标记录</span><b>${success}</b></div><div class="metric"><span>待跟进</span><b>${follow}</b></div>`;const rs=visibleRecords();if(!rs.length){$('#recordList').innerHTML=`<div class="empty"><b>暂时没有记录</b><span>教师发布数据后，记录会显示在这里。</span></div>`;return}$('#recordList').innerHTML=rs.map(r=>{const es=(r.entries||[]).filter(e=>e.status&&e.status!=='unset'),done=es.filter(e=>good(e.status)).length,followEs=es.filter(e=>risk(e.status)),names=[...new Set(followEs.map(e=>e.name))];return `<article class="record"><div class="record-top"><div><div><span class="tag">${esc(TYPES[r.type]||'记录')}</span> <span class="title">${esc(r.title||'未命名任务')}</span></div><div class="meta"><span>${dateCN(r.date)}</span><span>${esc(ci.name)}</span></div></div><div class="numbers"><span><b>${done}</b>达标</span><span><b>${followEs.length}</b>待跟进</span></div></div>${names.length?`<div class="follow"><b>待跟进学生</b>${names.map(esc).join('、')}</div>`:''}<details class="details"><summary>查看学生明细</summary><div class="table-wrap"><table><thead><tr><th>学生</th><th>状态</th><th>分数/等级</th><th>备注</th></tr></thead><tbody>${es.map(e=>`<tr><td>${String(e.number??'').padStart(2,'0')}号 ${esc(e.name)}</td><td class="${good(e.status)?'status-good':risk(e.status)?'status-risk':''}">${esc(STATUS[e.status]||e.status)}</td><td>${esc(e.score||'—')}</td><td>${esc(e.note||'—')}</td></tr>`).join('')}</tbody></table></div></details></article>`}).join('')}
async function load(){try{const res=await fetch(`records.json?v=${Date.now()}`,{cache:'no-store'});if(!res.ok)throw new Error(`HTTP ${res.status}`);const data=await res.json();records=Array.isArray(data)?data:(Array.isArray(data.records)?data.records:[]);$('#updated').textContent=data.publishedAt?`更新于 ${new Date(data.publishedAt).toLocaleString('zh-CN')}`:'尚未发布数据';render()}catch(e){$('#errorBox').style.display='block';$('#errorBox').textContent='数据加载失败，请稍后刷新页面。';$('#updated').textContent='加载失败';records=[];render()}}
$('#typeFilter').onchange=render;$('#searchInput').oninput=render;$('#resetBtn').onclick=()=>{$('#typeFilter').value='all';$('#searchInput').value='';render()};renderTabs();load();
</script>
</body></html>
